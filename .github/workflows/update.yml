name: Check package updates

on:
  schedule:
    - cron: "20 0 * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-updates
  cancel-in-progress: false

jobs:
  update:
    name: Update package sources
    runs-on: ubuntu-latest
    timeout-minutes: 30

    container:
      image: archlinux:latest

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.PACSHELF_APP_CLIENT_ID }}
          private-key: ${{ secrets.PACSHELF_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Prepare Arch environment
        shell: bash
        run: |
          set -euo pipefail

          pacman -Syu --noconfirm --needed \
            base-devel \
            devtools \
            git \
            nvchecker \
            pacman-contrib \
            pyalpm \
            sudo

          useradd --create-home builder

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          chown -R builder:builder "${GITHUB_WORKSPACE}"
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Check upstream versions
        shell: bash
        env:
          TERM: xterm
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          trap 'rm -f /home/builder/.netrc' EXIT
          install -o builder -g builder -m 0600 /dev/null /home/builder/.netrc
          printf 'machine github.com login x-access-token password %s\n' \
            "${GITHUB_TOKEN}" > /home/builder/.netrc

          sudo -u builder -- bash -lc "
            cd '${GITHUB_WORKSPACE}'
            ./scripts/update
          "

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "Update package versions"
          title: "Update package versions"
          body: |
            Automated upstream package updates.

            Package builds run in the pull request workflow before these
            changes can be merged.
          branch: automation/package-updates
          delete-branch: true
          add-paths: |
            packages
            README.md
          sign-commits: true
