name: Check package updates

on:
  schedule:
    - cron: "20 0 * * *"

  workflow_dispatch:

permissions: {}

concurrency:
  group: package-updates
  cancel-in-progress: false

jobs:
  update:
    name: Update package sources
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PACSHELF_APP_CLIENT_ID }}
          private-key: ${{ secrets.PACSHELF_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Prepare Arch environment
        shell: bash
        run: |
          set -euo pipefail

          pacman -Syu --noconfirm --needed \
            base-devel \
            devtools \
            git \
            nvchecker \
            pacman-contrib \
            pyalpm \
            sudo

          useradd --create-home builder

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          chown -R builder:builder "${GITHUB_WORKSPACE}"
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Check upstream versions
        shell: bash
        env:
          TERM: xterm
        run: |
          set -euo pipefail

          sudo -u builder -- bash -lc "
            set -euo pipefail
            cd '${GITHUB_WORKSPACE}'

            for package_dir in packages/*; do
              [[ -d \"\${package_dir}\" ]] || continue

              package=\"\${package_dir##*/}\"
              ./scripts/update \"\${package}\"
            done
          "

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "Update package versions"
          title: "Update package versions"
          body: |
            Automated upstream package updates.

            Package builds and artifact validation run in the normal pull
            request workflow before these changes can be merged.
          branch: automation/package-updates
          delete-branch: true
          add-paths: packages
          sign-commits: true
