name: Validate packages

on:
  pull_request:

  push:
    branches:
      - main
    paths:
      - "packages/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and validate packages
    runs-on: ubuntu-latest
    timeout-minutes: 60

    container:
      image: archlinux:latest

    steps:
      - name: Prepare Arch environment
        shell: bash
        run: |
          set -euo pipefail

          pacman -Syu --noconfirm --needed \
            base-devel \
            git \
            shellcheck \
            sudo

          useradd --create-home builder

          printf '%s\n' \
            'builder ALL=(ALL:ALL) NOPASSWD: ALL' \
            > /etc/sudoers.d/builder

          chmod 0440 /etc/sudoers.d/builder

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: ShellCheck
        shell: bash
        run: |
          set -euo pipefail

          shellcheck --exclude=SC1091 scripts/* packages/*/*-launcher

      - name: Build packages
        shell: bash
        run: |
          set -euo pipefail

          chown -R builder:builder "${GITHUB_WORKSPACE}"
          runuser -u builder -- ./scripts/build
