name: Validate packages

on:
  pull_request:

  push:
    branches:
      - main
    paths:
      - "packages/**"
      - "scripts/**"
      - "config/**"
      - ".github/workflows/validate.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and validate packages
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare Arch environment
        shell: bash
        run: |
          set -euo pipefail

          pacman -Syu --noconfirm --needed \
            base-devel \
            namcap \
            shellcheck \
            sudo

          useradd --create-home builder

          printf '%s\n' \
            'builder ALL=(ALL:ALL) NOPASSWD: ALL' \
            > /etc/sudoers.d/builder

          chmod 0440 /etc/sudoers.d/builder
          chown -R builder:builder "${GITHUB_WORKSPACE}"

      - name: ShellCheck
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t shell_files < <(
            {
              find scripts -type f -print
              find packages -type f -name validate -print
            } | sort
          )

          shellcheck "${shell_files[@]}"

      - name: Build and validate
        shell: bash
        run: |
          set -euo pipefail

          sudo -u builder -- bash -lc "
            set -euo pipefail
            cd '${GITHUB_WORKSPACE}'

            for package_dir in packages/*; do
              package=\"\${package_dir##*/}\"

              printf '\n==> PacShelf CI: %s\n' \"\${package}\"

              ./scripts/pipeline \"\${package}\"
            done
          "
